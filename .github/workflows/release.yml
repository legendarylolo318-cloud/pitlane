name: release
# Tag push (v*) builds everything and publishes a GitHub Release.
# Manual runs (workflow_dispatch) build the same artifacts without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libfontconfig1-dev libxcb1-dev libwayland-dev libgl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libfontconfig1-dev libxcb1-dev libwayland-dev libgl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libfuse2
      - run: cargo build --release -p pitlane-app --bin pitlane
      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/64x64/apps
          cp target/release/pitlane AppDir/usr/bin/
          cp packaging/pitlane.desktop AppDir/usr/share/applications/
          cp packaging/pitlane.desktop AppDir/
          cp crates/pitlane-app/assets/icon.png AppDir/pitlane.png
          cp crates/pitlane-app/assets/icon.png AppDir/usr/share/icons/hicolor/64x64/apps/pitlane.png
          ln -sf usr/bin/pitlane AppDir/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir Pitlane-x86_64.AppImage
          ls -l Pitlane-x86_64.AppImage target/release/pitlane
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: Pitlane-x86_64.AppImage, if-no-files-found: error }

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - run: cargo build --release -p pitlane-app --bin pitlane --target x86_64-pc-windows-msvc
      - run: Copy-Item target/x86_64-pc-windows-msvc/release/pitlane.exe Pitlane-x86_64-windows.exe
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: Pitlane-x86_64-windows.exe, if-no-files-found: error }

  android:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      # The runner image ships the Android SDK (ANDROID_HOME) and NDKs; only fetch what is missing.
      - name: Android SDK / NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -d "$ANDROID_HOME/platforms/android-34" ] || "$SDKM" "platforms;android-34"
          [ -d "$ANDROID_HOME/build-tools/34.0.0" ] || "$SDKM" "build-tools;34.0.0"
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "Using NDK $NDK"; ls "$NDK" > /dev/null
          echo "NDK=$NDK" >> "$GITHUB_ENV"
      - run: cargo install cargo-apk --locked
      - name: Release keystore
        # Use the ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD secrets when present (stable signing
        # key, so installed apps can update in place). Otherwise sign with a throwaway key.
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret: signing with a throwaway key"
            KS_PASS=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Pitlane"
            echo "::add-mask::$KS_PASS"
            echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          fi
      - name: Build APK (GPU renderer)
        run: |
          export ANDROID_NDK_ROOT="$NDK"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          export CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/release.keystore"
          export CARGO_APK_RELEASE_KEYSTORE_PASSWORD="$KS_PASS"
          cargo apk build --release -p pitlane-app --lib --no-default-features --features renderer-femtovg
          cp target/release/apk/*.apk Pitlane-android-arm64.apk
          ls -l Pitlane-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: Pitlane-android-arm64.apk, if-no-files-found: error }

  release:
    needs: [linux, windows, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
