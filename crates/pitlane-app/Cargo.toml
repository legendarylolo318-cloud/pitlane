[package]
name = "pitlane-app"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "pitlane"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "pitlane"
path = "src/main.rs"

[features]
# Desktop default: Slint's CPU renderer. A full 1100x760 redraw takes ~1 ms, it needs no GPU
# context (0 VRAM instead of ~75 MB) and halves resident memory. See README "Renderer".
default = ["renderer-software"]
renderer-software = ["slint/renderer-software"]
# GPU renderer (OpenGL / GLES). Used for the Android APK, where full-screen scrolling at phone
# resolutions on slower cores is smoother on the GPU:
#   cargo apk build --release -p pitlane-app --lib --no-default-features --features renderer-femtovg
renderer-femtovg = ["slint/renderer-femtovg"]

[dependencies]
pitlane-core = { path = "../pitlane-core" }
slint = { version = "1.9", default-features = false, features = ["std", "compat-1-2", "accessibility"] }
png = "0.17"

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "1.9", default-features = false, features = ["backend-winit"] }
arboard = { version = "3", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.9", default-features = false, features = ["backend-android-activity-06"] }

[build-dependencies]
slint-build = "1.9"

[package.metadata.android]
package = "io.github.pitlane.app"
build_targets = ["aarch64-linux-android"]
apk_name = "Pitlane"
# launcher icons (legacy + adaptive), generated by packaging/make_icons.py
resources = "android/res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Pitlane"
icon = "@mipmap/ic_launcher"

# Handle rotation / keyboard / dark-mode changes in place instead of restarting the activity.
[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode|density"
orientation = "unspecified"

[[example]]
name = "snap"
required-features = ["renderer-software"]

[[test]]
name = "ui"
required-features = ["renderer-software"]
