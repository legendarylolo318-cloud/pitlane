[package]
name = "pitlane-app"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "pitlane"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "pitlane"
path = "src/main.rs"

[features]
default = ["renderer-femtovg"]
# GPU-accelerated default renderer
renderer-femtovg = ["slint/renderer-femtovg"]
# CPU renderer (e.g. `cargo build --release --no-default-features --features renderer-software`)
renderer-software = ["slint/renderer-software"]

[dependencies]
pitlane-core = { path = "../pitlane-core" }
slint = { version = "1.9", default-features = false, features = ["std", "compat-1-2", "accessibility"] }
png = "0.17"

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "1.9", default-features = false, features = ["backend-winit"] }
arboard = { version = "3", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.9", default-features = false, features = ["backend-android-activity-06"] }

[build-dependencies]
slint-build = "1.9"

[package.metadata.android]
package = "io.github.pitlane.app"
build_targets = ["aarch64-linux-android"]
apk_name = "Pitlane"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Pitlane"
