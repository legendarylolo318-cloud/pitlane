[workspace]
resolver = "2"
members = ["crates/pitlane-core", "crates/pitlane-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

# Smaller Android build: `cargo apk build --profile release-android`
[profile.release-android]
inherits = "release"
opt-level = "s"
