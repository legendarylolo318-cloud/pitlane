[workspace]
resolver = "2"
members = ["crates/pitlane-core", "crates/pitlane-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
lto = "fat"
codegen-units = 1
# "s" is 21 % smaller than 3 and only ~6 % slower to render (measured with examples/snap.rs);
# "z" would halve rendering speed.
opt-level = "s"
strip = true
panic = "abort"
